<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>message-printer (v1)</title>
    <style>
        /* 全体スタイル */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f7;
            color: #333;
        }

        /* 印刷対象外（編集エリア・操作ボタン） */
        .editor-section {
         background: #ffffff;
         padding: 16px;
         border-radius: 12px;
         box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
         margin-bottom: 24px;
        }

        textarea {
          width: 100%;
          height: 140px;
          padding: 10px;
          border: 1px solid #ccc;
          border-radius: 8px;
          box-sizing: border-box;
          font-size: 14px;
          resize: vertical;
          line-height: 1.4;
        }
        
        .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
            margin-bottom: 12px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary { background: #007aff; color: white; }
        .btn-print   { background: #34c759; color: white; }
        
        /* プレビュー表示エリア（吹出し風デザイン） */
        .chat-container {
          background: #ffffff;
          padding: 20px;
          border-radius: 12px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .chat-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* 相手のメッセージ（左寄せ・グレー） */
        .chat-bubble.left {
            background-color: #e9e9eb;
            color: #000;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        /* 自分のメッセージ（右寄せ・ブルー） */
        .chat-bubble.right {
            background-color: #007aff;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* ========================================
           印刷用スタイル（@media print）
           ======================================== */
        @media print{
            body {
                background: #ffffff;
                padding: 0;
                max-width: 100%;
            }

            /* 入力欄やボタン類を非表示 */
            .no-print {
                display: none !important;
            }

            /* プレビュー枠の陰影を消して用紙いっぱいに伸ばす */
            .chat-container {
                box-shadow: none;
                padding: 0;
            }

            /* インク節約・読みやすさ重視（白黒＋枠線等に落とし込む調整も可） */
            .chat-bubble {
                page-break-inside: avoid; /* 吹出しの途中でページ跨ぎさせない */
               }   
        }   
    </style>
</head>
<body>

    <!-- 入力・コントロール部分（印刷時は自動で非表示） -->
     <div class="editor-section no-print">
        <h2>📱 message-printer v1</h2>
       <!-- <p style="font-size: 12px; color: #666;">iPhoneでコピーしたメッセージテキストを貼り付けて「プレビュー更新」を押してください。</p> -->

        <textarea id="inputText" placeholder=">相手のメッセージ&#10;>自分のメッセージ&#10;>先頭に > をつけると相手のメッセージになります"></textarea>
        <div class="help-text">
            💡 行の先頭に <code>&lt;</code> を付けると相手（左）、<code>&gt;</code> を付けると自分（右）になります。<br>
            ※ 記号なしの行は直前の吹き出し内の改行になります。    
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="generatePreview()">プレビュー更新</button>
            <button class="btn-print" onclick="window.print()">🖨️  印刷する</button>
        </div>
    </div>

    <!-- 印刷プレビュー領域 -->
     <div id="previewArea" class="chat-container">
       <!-- 初期プレビュー表示 -->
     </div>

     <script>
       function generatePreview() {
        const text = document.getElementById('inputText').value;
        const previewArea = document.getElementById('previewArea');
        
        previewArea.innerHTML = ''; // プレビューエリアをクリア

        if (!text.trim()) {
            previewArea.innerHTML = '<div class="chat-bubble left">テキストを入力してください。</div>';
            return;
        }

        // 改行で分割して、空行以外を吹き出し要素に変換
        const lines = text.split('\n');
        let currentGroup = null;

        lines.forEach(line => {
          let isLeft = null;
          let content = line;
          
          if (line.startsWith('<')) {
            isLeft = true;
            content = line.slice(1);
            } else if (line.startsWith('>')) {
            isLeft = false;
            content = line.slice(1);
            }

            // 新しい吹き出しの開始（< または > がある場合）
            if (isLeft !== null) {
                if (currentGroup) {
                    renderBubble(previewArea, currentGroup);
                }
            currentGroup = { 
                isLeft: isLeft,
                lines: [content] 
            };
       } else if (currentGroup) {
            // 記号がない行は直前の吹き出し中に改行として追加
            currentGroup.lines.push(content);
        }
    });

    if (currentGroup) {
        renderBubble(previewArea, currentGroup);
    }
}

function renderBubble(container, group) {
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${group.isLeft ? 'left' : 'right'}`;
    bubble.textContent = group.lines.join('\n');
    container.appendChild(bubble);
}

// 初回読み込み時のサンプル表示
window.onload = function() {
    document.getElementById('inputText').value = ">こんばんは！現場監督の萩さん。ジェミちゃんです。良く頑張りましたね。\nここまで出来るなんて凄いですね。次は何しますか？何を作りましょうか？\n>今日はおやすみなさいませ。良い夢を。";
    generatePreview();
};
</script>
    
</body>
</html>
